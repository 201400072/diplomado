<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <white_list>127.0.0.1</white_list>
    <white_list>10.10.0.0/24</white_list>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <protocol>tcp</protocol>
    <force_insert>yes</force_insert>
    <force_time>0</force_time>
    <purge>yes</purge>
    <use_password>no</use_password>
  </auth>

  <rules>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <rule_exclude>0220-maldetect_rules.xml</rule_exclude>
    <rule_exclude>0230-ms-se_rules.xml</rule_exclude>
    <rule_exclude>0240-webshell_rules.xml</rule_exclude>
    <rule_exclude>0250-apache_rules.xml</rule_exclude>
    <rule_exclude>0260-nginx_rules.xml</rule_exclude>
    <rule_exclude>0270-php-rules.xml</rule_exclude>
    <rule_exclude>0280-attack_rules.xml</rule_exclude>
    <rule_exclude>0290-system_localrules.xml</rule_exclude>
    <rule_exclude>0300-postgres_rules.xml</rule_exclude>
    <rule_exclude>0305-mysql_rules.xml</rule_exclude>
    <rule_exclude>0310-sshd_rules.xml</rule_exclude>
    <rule_exclude>0315-smb_rules.xml</rule_exclude>
    <rule_exclude>0320-apache_rules.xml</rule_exclude>
    <rule_exclude>0325-nginx_rules.xml</rule_exclude>
    <rule_exclude>0330-squid_rules.xml</rule_exclude>
    <rule_exclude>0335-pix_rules.xml</rule_exclude>
    <rule_exclude>0340-pam_rules.xml</rule_exclude>
    <rule_exclude>0345-vsftpd_rules.xml</rule_exclude>
    <rule_exclude>0350-asterisk_rules.xml</rule_exclude>
    <rule_exclude>0355-dhcpd_rules.xml</rule_exclude>
    <rule_exclude>0360-named_rules.xml</rule_exclude>
    <rule_exclude>0365-snort_rules.xml</rule_exclude>
    <rule_exclude>0370-cisco-ios_rules.xml</rule_exclude>
    <rule_exclude>0375-cisco-asa_rules.xml</rule_exclude>
    <rule_exclude>0380-oscap_rules.xml</rule_exclude>
    <rule_exclude>0385-pci_dss_rules.xml</rule_exclude>
    <rule_exclude>0390-fortigate_rules.xml</rule_exclude>
    <rule_exclude>0395-vulnerability-detector.xml</rule_exclude>
    <rule_exclude>0400-openscap_rules.xml</rule_exclude>
    <rule_exclude>0405-hp_rules.xml</rule_exclude>
    <rule_exclude>0410-solaris_bsm_rules.xml</rule_exclude>
    <rule_exclude>0415-docker_rules.xml</rule_exclude>
    <rule_exclude>0420-freeipa_rules.xml</rule_exclude>
    <rule_exclude>0425-cis_rules.xml</rule_exclude>
    <rule_exclude>0430-ms365_rules.xml</rule_exclude>
    <rule_exclude>0435-amazon_rules.xml</rule_exclude>
    <rule_exclude>0440-google_rules.xml</rule_exclude>
    <rule_exclude>0445-mongodb_rules.xml</rule_exclude>
    <rule_exclude>0450-kubernetes_rules.xml</rule_exclude>
    <rule_exclude>0455-jenkins_rules.xml</rule_exclude>
    <rule_exclude>0460-azure_rules.xml</rule_exclude>
    <rule_exclude>0465-panw_rules.xml</rule_exclude>
    <rule_exclude>0470-authenticated_rules.xml</rule_exclude>
    <rule_exclude>0475-suricata_rules.xml</rule_exclude>
    <rule_exclude>0480-iptables_rules.xml</rule_exclude>
    <rule_exclude>0485-docker_integration_rules.xml</rule_exclude>
    <rule_exclude>0490-vulnerability_rules.xml</rule_exclude>
    <custom_rules>rules</custom_rules>
  </rules>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs/suricata/eve.json</location>
  </localfile>
</ossec_config>