%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[10.10.0.0/24,10.10.10.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "[10.10.0.40,10.10.10.40]"
    SSH_SERVERS: "[10.10.0.40,10.10.10.40]"

default-log-dir: /var/log/suricata/
stats:
  enabled: yes
  interval: 8

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      rotate-interval: 60m
      types:
        - alert

app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 12mb
          response-body-limit: 12mb
    tls:
      enabled: yes
    ssh:
      enabled: yes

default-rule-path: /etc/suricata/rules
rule-files:
  - local.rules

af-packet:
  - interface: eth1
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    threads: 1

host-os-policy:
  linux: [10.10.0.0/24, 10.10.10.0/24]
  windows: [192.168.0.0/16, 172.16.0.0/12]
  bsd: []


# Listen on eth1 (soc_span) where DVWA resides

# Limites para entorno de laboratorio
stream:
  memcap: 64mb
  checksum-validation: yes

flow:
  memcap: 32mb
  hash-size: 65536
  prealloc: 10000

flow-timeouts:
  default:
    new: 30
    established: 300
    closed: 0
  tcp:
    new: 30
    established: 300
    closed: 0
  udp:
    new: 30
    established: 300

detect:
  profile: medium
  custom-values:
    toclient-groups: 3
    toserver-groups: 3